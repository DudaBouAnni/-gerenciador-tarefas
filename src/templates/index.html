<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <header>
        <h1>TaskFlow</h1>
        <p>Organize suas tarefas em um só lugar.</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Nova tarefa</h2>

            <form id="task-form">
                <input type="text" id="title" placeholder="Título da tarefa" maxlength="100" required>

                <textarea id="description" placeholder="Descrição (opcional)"></textarea>

                <label for="priority">Prioridade</label>
                <select id="priority">
                    <option value="baixa">Baixa</option>
                    <option value="média" selected>Média</option>
                    <option value="alta">Alta</option>
                </select>

                <button type="submit">Adicionar tarefa</button>
            </form>
        </section>

        <section class="tasks-section">
            <h2>Minhas tarefas</h2>

            <label for="status-filter">Filtrar por status:</label>
            <select id="status-filter">
                <option value="">Todas</option>
                <option value="A Fazer">A Fazer</option>
                <option value="Em Progresso">Em Progresso</option>
                <option value="Concluído">Concluído</option>
            </select>

            <div id="task-list">
                <p>Carregando tarefas...</p>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', path='js/script.js') }}"></script>
</body>
</html>
